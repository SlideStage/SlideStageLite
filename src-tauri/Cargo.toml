[package]
name = "slides-deck-lite-desktop"
version = "0.1.0"
description = "SlidesDeckLite — pure local .hcslides presentation runtime"
authors = ["hcliu"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "slides_deck_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
